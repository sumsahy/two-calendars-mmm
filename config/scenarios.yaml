# Synthetic-world scenarios. Committed to git BEFORE any model was fitted (see D-004, D-009).
# Every number here is a "true" parameter of the simulated world, known only to the generator.
#
# Units: spend and sales in USD. Sales are monthly net revenue of a mid-size diabetes brand.
# Half-lives are in days (truth is simulated at daily grain).
# avg_roi = true total contribution / total spend over the analysis window.
# saturation = mean adstocked level / saturation scale k (response = 1 - exp(-x / k)). Higher = more saturated,
#              so marginal ROI falls further below average ROI.

defaults:
  seed: 20261125
  start: "2023-01-01"
  end: "2025-12-31"
  burn_in_days: 120
  base_daily_sales: 150000          # baseline revenue per day before trend/seasonality
  trend_per_year: 0.04              # 4% baseline growth per year
  seasonality_amp: 0.05             # smooth yearly cycle
  january_dip: 0.08                 # deductible / insurance reset dip in January fills
  sales_noise_sd: 0.03              # multiplicative monthly noise
  weekend_delivery_weight: 1.35     # TV delivery is heavier on weekends inside a buying week
  delivery_noise_sd: 0.15           # day-level noise in TV delivery
  tv:
    weekly_mean: 250000
    weekly_sd_log: 0.25
    flighting: bursty               # bursty | always_on
    flight_weeks: [3, 7]
    gap_weeks: [2, 5]
    half_life_days: 14
    avg_roi: 1.6
    saturation: 0.8
  digital:
    monthly_mean: 450000
    monthly_sd_log: 0.20
    corr_with_tv: 0.3               # planners partly co-schedule digital with TV flights
    half_life_days: 5
    avg_roi: 1.7
    saturation: 0.7
  email:
    monthly_mean: 120000
    monthly_sd_log: 0.25
    corr_with_tv: 0.0
    half_life_days: 3
    avg_roi: 2.5
    saturation: 0.5
  reallocation:
    tv_cut_share: 0.15              # the implemented recommendation: 15% of TV moved out
    # Moved budget is split between digital and email in proportion to their current
    # spend (assumption A-07; the memo does not state the split).

# Main scenario is deliberately a CLOSE CALL between TV and digital at the margin.
# Reason (D-009): a data error can only flip a decision that sits near the boundary.
# The sweep below covers worlds far from the boundary in both directions.
scenarios:
  main: {}
  tv_clearly_better:
    tv: {saturation: 0.4, avg_roi: 1.8}
  digital_clearly_better:
    tv: {saturation: 1.3, avg_roi: 1.3}
  always_on_tv:
    tv: {flighting: always_on, weekly_sd_log: 0.15, weekly_mean: 160000}
  high_tv_digital_corr:
    digital: {corr_with_tv: 0.7}
  long_tv_adstock:
    tv: {half_life_days: 35}
  two_years_only:
    start: "2024-01-01"
